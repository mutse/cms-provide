name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'manifest.json'
      - 'wrangler.toml'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          # 在仓库 Settings > Secrets and variables > Actions 里新建
          # CLOUDFLARE_API_TOKEN（Workers 部署权限的 API Token）
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
